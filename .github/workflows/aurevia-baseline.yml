name: AUREVIA baseline quality checks

on:
  push:
    branches:
      - work/baseline-ci-2026-11-15

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests
        run: npm test
      - name: Build production assets
        run: npm run build
