name: AUREVIA quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - work/trade-validation-no-broker-2026-11-15
      - work/multi-asset-support-2026-11-15

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Verify shared market catalogue is shipped
        run: test -s dist/market-catalog.js
