[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/market-quote"
  to = "/.netlify/functions/market-quote"
  status = 200

[[redirects]]
  from = "/api/market-data"
  to = "/.netlify/functions/market-data"
  status = 200

[[redirects]]
  from = "/api/ai-analysis"
  to = "/.netlify/functions/ai-analysis"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/api/service-status"
  to = "/.netlify/functions/service-status"
  status = 200

[[redirects]]
  from = "/api/telegram-webhook"
  to = "/.netlify/functions/telegram-webhook"
  status = 200

[[redirects]]
  from = "/api/telegram-notify"
  to = "/.netlify/functions/telegram-notify"
  status = 200

[[redirects]]
  from = "/api/telegram-unlink"
  to = "/.netlify/functions/telegram-unlink"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin-api"
  status = 200

[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session-api"
  status = 200

[functions."trade-watch"]
schedule = "* * * * *"

[[redirects]]
  from = "/api/account-reject-new-login"
  to = "/.netlify/functions/account-reject-new-login"
  status = 200

[[redirects]]
  from = "/api/scenario"
  to = "/.netlify/functions/scenario-api"
  status = 200

[functions."scenario-watch"]
schedule = "* * * * *"
